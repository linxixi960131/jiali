<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light">
<title><!-- TITLE --></title>
<style>
<!-- STYLE -->
</style>
</head>
<body>
<div class="workspace">
  <aside class="sidebar" aria-label="文档目录">
    <div class="identity">
      <span class="monogram" aria-hidden="true">傅</span>
      <h1><!-- TITLE --></h1>
    </div>
    <div class="finder">
      <label for="search">搜索文档</label>
      <input id="search" type="search" placeholder="输入文档名" autocomplete="off">
    </div>
    <nav class="filters" aria-label="按类型筛选">
      <!-- FILTERS -->
    </nav>
    <nav class="entries" aria-label="文档">
      <h2 id="list-title">全部文档</h2>
      <p id="results" role="status" aria-live="polite" class="visually-hidden"></p>
      <ul id="documents"><!-- LIST --></ul>
    </nav>
  </aside>
  <main id="reader" aria-label="阅览区">
    <p id="empty" hidden>当前筛选条件下没有文档。</p>
    <!-- ARTICLES -->
  </main>
</div>
<script>
<!-- SCRIPT -->
</script>

</html>
